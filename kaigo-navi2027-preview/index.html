let reviewedExplainers=new Map();
function safePDF(a){return a&&typeof a.source_pdf==='string'&&a.source_pdf.startsWith('https://www.mhlw.go.jp/content/')?a.source_pdf:null}
function explainArticle(a){
 const ex=reviewedExplainers.get(a.id);if(!ex)return '';
 const title='原文確認済み・やさしい解説';
 const src=safePDF(ex);
 const citation=src?('<a class="exp-cite" target="_blank" rel="noopener noreferrer" href="'+esc(src)+'#page=1">厚労省の資料を開く ↗</a>'):'';
 const quick=ex.quick.map(v=>'<li>'+esc(v)+'</li>').join('');
 const deep=ex.explain.map(v=>'<section><h4>'+esc(v.heading)+'</h4><p>'+esc(v.body)+'</p><span class="exp-score">'+esc(v.source)+'</span></section>').join('');
 const cits=ex.verified_claims.map(v=>'<li>'+esc(v.claim)+'<br><a class="exp-cite" target="_blank" rel="noopener noreferrer" href="'+esc(src)+'#page='+Number(v.pdf_page)+'">'+esc(v.source)+' （PDF '+Number(v.pdf_page)+'ページ）↗</a></li>').join('');
 const sales=ex.sales;
 return '<section class="exp-card"><div class="exp-hero"><b>📘 '+title+'</b><span class="exp-safe">'+esc(ex.status)+'</span></div>'+
 '<p class="exp-meta">対象：'+esc(ex.category)+' ／ 審議：'+esc(ex.meeting_date)+'<br>'+esc(ex.source_scope)+'</p>'+
 '<p class="exp-lead">'+esc(ex.one_liner)+'</p>'+
 '<div class="exp-tabs" role="tablist" aria-label="記事の読み方"><button type="button" role="tab" aria-selected="true" data-exp-tab="quick">⚡ 30秒で理解</button><button type="button" role="tab" aria-selected="false" data-exp-tab="deep">📖 詳しく</button><button type="button" role="tab" aria-selected="false" data-exp-tab="sales">💼 営業で使う</button></div>'+
 '<div class="exp-panel" data-exp-panel="quick"><ol class="exp-list">'+quick+'</ol><h4>今とこれからの違い</h4><p><b>現行：</b>'+esc(ex.now_vs_next.now)+'</p><p><b>2027年度に向けて：</b>'+esc(ex.now_vs_next.next)+'</p><div class="exp-alert">⚠️ '+esc(ex.numerical_caution)+'</div></div>'+
 '<div class="exp-panel" data-exp-panel="deep" hidden>'+deep+'<h4>原文に当たって確認できるポイント</h4><ol class="exp-list">'+cits+'</ol><div class="exp-alert">検討資料と公布された制度を区別してください。変更が決定したという記事ではありません。</div></div>'+
 '<div class="exp-panel" data-exp-panel="sales" hidden><h4>こんな聞き方から</h4><div class="exp-quote">'+esc(sales.approach)+'</div><h4>施設に説明する</h4><p>'+esc(sales.facility)+'</p><h4>ケアマネジャーに説明する</h4><p>'+esc(sales.caremanager)+'</p><h4>利用者・ご家族に説明する</h4><p>'+esc(sales.family)+'</p><div class="exp-alert">誤解を避けるために：'+esc(sales.caution)+'</div></div>'+
 '<p class="exp-scope"><b>検証した範囲：</b>'+esc(ex.review_scope)+'<br>'+citation+'</p></section>';
}

function go(to){if(to==='home'){mode='home';$('home').classList.add('current');$('view').classList.remove('current')}else{mode=to;$('home').classList.remove('current');$('view').classList.add('current');render()}document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.go===to));window.scrollTo(0,0)}
function row(a){return '<article class="card"><span class="tag">'+esc(a.category)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.summary)+'</p>'+(a.date?'<p class="vsub">会議開催日：'+esc(a.date)+'</p>':'')+'<div class="card-actions"><button class="primary" data-id="'+a.id+'">詳細を見る →</button><button class="secondary" data-save="'+a.id+'">'+(saved.has(a.id)?'♥ 保存済み':'♡ 保存')+'</button></div></article>'}
function render(){const heading={news:'最新情報',topics:'いま注目の法改正',today:'今日の発見',talk:'今日の営業ネタ',categories:'分野から探す',ai:'AIに聞く',favorites:'お気に入り',search:'記事を検索',detail:'記事詳細',category:'分野別の記事'}[mode];let content='<h1 class="vtitle">'+heading+'</h1>';
if(mode==='news'||mode==='topics'){let choices=items.filter(x=>mode==='news'?x.id.startsWith('n'):x.id.startsWith('t'));content+='<p class="vsub">厚労省の公式会議資料と確認できた議題です。資料の公開と制度の正式決定は異なります。</p><div class="filters">'+['すべて',...new Set(choices.map(x=>x.category))].map(f=>'<button class="filter '+(filter===f?'selected':'')+'" data-filter="'+f+'">'+f+'</button>').join('')+'</div><div class="cards">'+choices.filter(x=>filter==='すべて'||x.category===filter).map(row).join('')+'</div>'}
if(mode==='detail'){const a=items.find(x=>x.id===selected);if(a){const source=typeof a.source_url==='string'&&a.source_url.startsWith('https://www.mhlw.go.jp/')?a.source_url:null;content+='<div class="card"><span class="tag">'+(source?'厚労省・公式会議資料':'制度解説')+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.detail||a.summary)+'</p>'+(a.date?'<p><b>会議開催日：</b>'+esc(a.date)+'</p>':'')+'<h3>現在の扱い</h3><p>公式会議資料の掲載は、制度改正の正式決定・施行を意味しません。</p>'+(a.sales_tip?'<h3>営業での確認ポイント</h3><p>'+esc(a.sales_tip)+'</p>':'')+(source?'<p><b>出典：</b>'+esc(a.source_name||'厚生労働省')+'</p><p><a class="primary" href="'+esc(source)+'" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:11px 15px;border-radius:11px;color:#fff;text-decoration:none">厚労省の元資料を確認 ↗</a></p>':'')+'<div class="card-actions"><button class="secondary" data-save="'+a.id+'">'+(saved.has(a.id)?'♥ 保存済み':'♡ お気に入り')+'</button></div></div>'}}
if(mode==='detail'){const a=items.find(x=>x.id===selected);if(a)content+=explainArticle(a);}
if(mode==='detail' && !reviewedExplainers.has(selected) && selected!=='n-pay-269' && String(selected||'').startsWith('n-'))content+='<p class="exp-alert">この記事は現在、概要版です。本文・数値・適用条件まで確認した3段階の解説が整い次第、ここに追加します。</p>'; 
if(mode==='detail' && selected==='n-pay-269') {
  const links=[['n-pay-269-gh','認知症グループホームの解説'],['n-pay-269-sm','小規模多機能の解説'],['n-pay-269-nm','看護小規模多機能の解説'],['n-pay-269-dn','定期巡回・夜間対応型訪問介護の解説']];
  content+='<section class="card"><h3>📘 分科会の個別解説を読む</h3><p>本日の会議には複数のテーマがあります。詳しい本文と営業向けの説明は、次の記事で確認できます。</p>'+links.map(x=>'<p><button class="primary" type="button" data-id="'+x[0]+'" style="width:100%;text-align:left;padding:13px;margin:2px 0;border-radius:12px;">'+x[1]+' →</button></p>').join('')+'</section>';
}
if(mode==='today')content+='<div class="card"><h3>5分でわかる介護制度改正の基礎</h3><p>大切なのは「検討」「決定」「施行」の違いです。報道だけでなく、制度を所管する省庁の公表資料と日付を確認しましょう。</p></div>';
if(mode==='talk')content+='<div class="card"><span class="tag">営業トークの例</span><h3>「最近、施設の運営で困っていることはありますか？」</h3><p>すぐに制度の説明を始めるのではなく、相手の課題を聞き、実際の改正情報が確認できた段階で関係する制度を伝えます。</p></div>';
if(mode==='categories')content+='<div class="cards">'+categories.map(c=>'<button class="card" style="text-align:left" data-cat="'+esc(c[1])+'"><h3>'+c[0]+' '+esc(c[1])+' →</h3></button>').join('')+'</div>';
if(mode==='category')content+='<h2>'+esc(selected)+'</h2><div class="cards">'+(items.filter(x=>x.category===selected).map(row).join('')||'<div class="empty">該当する記事はありません。</div>')+'</div>';
if(mode==='search'||mode==='ai')content+='<p class="vsub">'+(mode==='ai'?'現在は記事内のキーワード検索のみ。AIによる制度解説の自動回答には未対応です。':'掲載記事をキーワードで探せます。')+'</p><input class="input" id="q" placeholder="例：BCP / 人員配置"><div class="cards" id="results"></div>';
if(mode==='favorites')content+='<div class="cards">'+(items.filter(x=>saved.has(x.id)).map(row).join('')||'<div class="empty">保存した記事はまだありません。</div>')+'</div>';
content+='<div class="notice">最新情報は厚生労働省の公式会議資料の概要です。決定した改正や施行日ではありません。テーマ解説・AI機能は試作段階です。</div>';$('viewbody').innerHTML=content;if(mode==='search'||mode==='ai'){$('q').addEventListener('input',e=>{$('results').innerHTML=items.filter(x=>e.target.value.trim()&&(x.title+x.summary+x.category).includes(e.target.value.trim())).map(row).join('')||'<div class="empty">該当する記事がありません。</div>'})}}
const detailHistory=[];
function openArticle(id){if(mode==='detail'){if(selected)detailHistory.push(selected)}else{detailHistory.length=0;from=mode}selected=id;go('detail')}
function paintOfficialHome(){const news=items.filter(x=>x.id.startsWith('n')).slice(0,3);$('homeNews').innerHTML=news.map(x=>'<button class="news" data-id="'+x.id+'"><img class="nthumb" src="'+x.image+'" alt=""><span class="ncopy"><span class="meta"><span class="state '+x.tag+'">'+esc(x.state)+'</span><span class="date">'+esc((x.date||'').slice(5).replace('-','/'))+' 開催</span></span><strong>'+esc(x.title)+'</strong><small>'+esc(x.summary)+'</small></span><span class="chev">›</span></button>').join('')}
paintOfficialHome();
$('featureGrid').innerHTML=items.filter(x=>x.id.startsWith('t')).map((x,i)=>'<button class="feature '+(i===1?'purple':i===2?'green wide':'')+'" data-id="'+x.id+'"><img class="feature-img" src="'+x.image+'" alt=""><span class="feature-text"><strong>'+esc(x.title)+'</strong><small>'+esc(x.summary)+'</small></span><span class="fnxt">›</span></button>').join('');
$('recommended').innerHTML=categories.map(c=>'<button class="rec" data-cat="'+esc(c[1])+'"><span class="rec-emoji">'+c[0]+'</span><b>'+esc(c[1])+'</b><small>情報を見る →</small></button>').join('');
$('back').addEventListener('click',()=>{if(mode==='detail'&&detailHistory.length){selected=detailHistory.pop();render();window.scrollTo(0,0);return}go(mode==='detail'?from:mode==='category'?'categories':'home')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-id],[data-save],[data-cat],[data-filter]');if(!b)return;if(b.dataset.id)return openArticle(b.dataset.id);if(b.dataset.save){const id=b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);if(mode==='detail'||mode==='favorites'||mode==='news'||mode==='topics')render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.cat){selected=b.dataset.cat;from='categories';go('category');return}if(b.dataset.go){if(mode!=='detail'&&mode!=='home')from=mode;go(b.dataset.go)}});

async function loadOfficialFeed(){
 try{
  const resp=await fetch('data/latest.json?v='+Date.now(),{cache:'no-store'});
  if(!resp.ok)throw Error('HTTP '+resp.status);
  const json=await resp.json();
  if(!Array.isArray(json.articles))throw Error('No articles');
  const candidates=json.articles.filter(a=>a&&typeof a.id==='string'&&a.id.startsWith('n-')&&/^20\d\d-\d\d-\d\d$/.test(a.date)&&typeof a.title==='string'&&typeof a.summary==='string'&&typeof a.source_url==='string'&&a.source_url.startsWith('https://www.mhlw.go.jp/')).sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id)).slice(0,40);
  if(!candidates.length)throw Error('No verified entries');
  const images=items.filter(x=>x.id.startsWith('n')).slice(0,3).map(x=>x.image);
  const today=new Date().toISOString().slice(0,10),recent=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  const arr=candidates.map((x,i)=>({...x,image:images[i%images.length],state:(i===0&&x.date>=recent)?'新着資料':(x.status||'会議資料'),tag:(i===0&&x.date>=recent)?'new':'review'}));
  items.splice(0,items.filter(x=>x.id.startsWith('n')).length,...arr);
  paintOfficialHome();
  try{
   const key='kaigo_official_meetings_seen_v1',prev=JSON.parse(localStorage.getItem(key)||'null');
   const ids=arr.map(a=>a.id),fresh=Array.isArray(prev)?ids.filter(id=>!prev.includes(id)).length:0;
   const label=document.querySelector('.updatetag');
   if(label)label.textContent=fresh?'● 前回から'+fresh+'件追加':'● 公式会議資料 '+arr.length+'件';
   localStorage.setItem(key,JSON.stringify(ids));
  }catch(e){const label=document.querySelector('.updatetag');if(label)label.textContent='● 公式会議資料 '+arr.length+'件'}
  if(['news','detail','category'].includes(mode))render();
 }catch(e){console.warn('公式資料データの取得に失敗。保存済みの確認記事を表示します。',e)}
}
loadOfficialFeed();

document.addEventListener('click',function(e){
 const tab=e.target.closest('[data-exp-tab]');
 if(!tab)return;
 const root=tab.closest('.exp-card');
 if(!root)return;
 const id=tab.dataset.expTab;
 root.querySelectorAll('[data-exp-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.expTab===id)));
 root.querySelectorAll('[data-exp-panel]').forEach(p=>{p.hidden=p.dataset.expPanel!==id});
});
async function loadReviewedExplainers(){
 try{
  const response=await fetch('data/explainers-verified.json?v=20261010v2',{cache:'no-store'});
  if(!response.ok)throw Error('Not yet verified');
  const data=await response.json();
  if(!Array.isArray(data.articles)||!Array.isArray(data.source_audits))throw Error('Invalid verified release');
  const verifiedIds=new Set(data.source_audits.filter(a=>a.evidence_checks&&a.evidence_checks.every(c=>c.status==='located')).map(a=>a.id));
  reviewedExplainers=new Map(data.articles.filter(a=>verifiedIds.has(a.id)).map(a=>[a.id,a]));
  if(mode==='detail'&&reviewedExplainers.has(selected))render();
 }catch(error){console.info('精読解説は未検証のため保留:',error.message)}
}
loadReviewedExplainers();
</script></body></html>
