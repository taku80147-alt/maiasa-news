name: LivNavi・公式PDFの制度検討項目を自動抽出
on:
  schedule:
    - cron: '25 23 * * *' # 日本時間08:25、公式会議の取得・全文収集の後
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kaigo-pdf-evidence.yml'
      - 'scripts/build_kaigo_pdf_evidence.py'
      - 'scripts/test_kaigo_pdf_evidence.py'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kaigo-pdf-evidence
  cancel-in-progress: false
jobs:
  read-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF検証ライブラリ
        run: python -m pip install pymupdf==1.26.5
      - name: 最新の公式PDFを読み原文ページへのリンクを作成
        run: python scripts/build_kaigo_pdf_evidence.py
      - name: 抽出手順と誤情報防止のテスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_pdf_evidence.py' -v
      - name: チェック済みの元資料インデックスのみ保存
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaigo-navi2027-preview/data/pdf-evidence.json
          if git diff --cached --quiet; then
            echo 'No new PDF analysis'
          else
            git commit -m '介護制度改正の原文PDF検討項目を更新'
            git pull --rebase origin main
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: read-and-publish
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.read-and-publish.outputs.revision }}
