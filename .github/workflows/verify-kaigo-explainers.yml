name: 介護制度改正・原文PDF検証
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * 6' # 日本時間 毎週日曜06:20、原文の変更もチェック
  push:
    branches: [main]
    paths:
      - scripts/build_kaigo_explainers.py
      - scripts/kaigo_evidence.py
      - scripts/test_kaigo_pipeline.py
      - scripts/test_kaigo_explainers.py
      - scripts/test_kaigo_evidence_contract.py
      - kaigo-navi2027-preview/data/explainers.json
      - kaigo-navi2027-preview/data/latest.json
      - .github/workflows/verify-kaigo-explainers.yml
permissions:
  contents: write
concurrency:
  group: kaigo-explainers
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAIGO_EVIDENCE_DIR: ${{ runner.temp }}/kaigo-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF本文検証ライブラリ
        run: python -m pip install pymupdf==1.26.5
      - name: 全PDFを読みページ根拠を照合（失敗時は公開しない）
        run: python scripts/build_kaigo_explainers.py
      - name: 変更・読取不能・途中失敗の安全性テスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_pipeline.py' -v
      - name: 数値・決定状況・出典との整合性テスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_explainers.py' -v
      - name: 出典URL・数値適用範囲・検討状況の契約テスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_evidence_contract.py' -v
      - name: 検証済みの解説のみ保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaigo-navi2027-preview/data/explainers-verified.json
          if git diff --cached --quiet; then
            echo 'No validated changes'
          else
            git commit -m '原文検証済みの制度解説を公開'
            git pull --rebase origin main
            git push origin main
          fi
      - name: 原本PDF・全ページ本文・表・注記の候補を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaigo-source-evidence
          path: ${{ runner.temp }}/kaigo-evidence/
          if-no-files-found: ignore
          retention-days: 7
