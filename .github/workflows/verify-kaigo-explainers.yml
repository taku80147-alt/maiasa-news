name: 介護制度改正・原文PDF検証
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * 6' # 日本時間 毎週日曜06:20、原文の変更もチェック
  push:
    branches: [main]
    paths:
      - scripts/build_kaigo_explainers.py
      - scripts/test_kaigo_explainers.py
      - scripts/test_kaigo_evidence_contract.py
      - kaigo-navi2027-preview/data/explainers.json
      - kaigo-navi2027-preview/data/latest.json
      - .github/workflows/verify-kaigo-explainers.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kaigo-explainers
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF本文検証ライブラリ
        run: python -m pip install pymupdf==1.26.5
      - name: 全PDFを読みページ根拠を照合（失敗時は公開しない）
        run: python scripts/build_kaigo_explainers.py
      - name: 数値・決定状況・出典との整合性テスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_explainers.py' -v
      - name: 出典URL・数値適用範囲・検討状況の契約テスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_evidence_contract.py' -v
      - name: 検証済みの解説のみ保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaigo-navi2027-preview/data/explainers-verified.json
          if git diff --cached --quiet; then
            echo 'No validated changes'
          else
            git commit -m '原文検証済みの制度解説を公開'
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 解説記事を公開
        id: deployment
        uses: actions/deploy-pages@v4
