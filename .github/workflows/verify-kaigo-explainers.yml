name: 介護制度改正・原文PDF検証
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * 6' # 日本時間 毎週日曜06:20、原文の変更もチェック
  push:
    branches: [main]
    paths:
      - scripts/build_kaigo_explainers.py
      - scripts/kaigo_evidence.py
      - scripts/test_kaigo_pipeline.py
      - scripts/test_kaigo_explainers.py
      - scripts/test_kaigo_evidence_contract.py
      - kaigo-navi2027-preview/data/explainers.json
      - kaigo-navi2027-preview/data/latest.json
      - .github/workflows/verify-kaigo-explainers.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kaigo-explainers
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.save.outputs.changed }}
      revision: ${{ steps.save.outputs.sha }}
    env:
      KAIGO_EVIDENCE_DIR: /tmp/kaigo-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF本文検証ライブラリ
        run: python -m pip install pymupdf==1.26.5
      - name: 全PDFを読みページ根拠を照合（失敗時は公開しない）
        run: python scripts/build_kaigo_explainers.py
      - name: 変更・読取不能・途中失敗の安全性テスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_pipeline.py' -v
      - name: 数値・決定状況・出典との整合性テスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_explainers.py' -v
      - name: 出典URL・数値適用範囲・検討状況の契約テスト
        run: python -m unittest discover -s scripts -p 'test_kaigo_evidence_contract.py' -v
      - name: 検証済みの解説のみ保存
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaigo-navi2027-preview/data/explainers-verified.json
          if git diff --cached --quiet; then
            echo 'No validated changes'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m '原文検証済みの制度解説を公開'
            git pull --rebase origin main
            git push origin main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 原本PDF・全ページ本文・表・注記の候補を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaigo-source-evidence
          path: /tmp/kaigo-evidence/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.verify.outputs.revision }}
  notify-failed-verification:
    needs: verify
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 原文の検証失敗を記録
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const title='[LivNavi監視] 制度解説のPDF原文検証に失敗';
            const body='PDF原本のダウンロード・ハッシュ・ページ根拠・精読記事の一貫性に問題があり、誤った解説の公開を中止しました。'+
              String.fromCharCode(10,10)+'確認用実行記録: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const {data:list}=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const found=list.find(i=>!i.pull_request&&i.title===title);
            if(found)await github.rest.issues.update({owner,repo,issue_number:found.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
