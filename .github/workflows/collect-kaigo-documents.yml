name: 介護制度改正・公式資料全文収集
on:
  schedule:
    - cron: '45 22 * * *' # 日本時間 毎朝07:45、Actionsに遅延あり
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_kaigo_documents.py
      - .github/workflows/collect-kaigo-documents.yml
permissions:
  contents: write
concurrency:
  group: kaigo-documents
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF本文収集に必要な無料ライブラリ
        run: python -m pip install pymupdf==1.26.5 beautifulsoup4==4.13.4
      - name: 公式PDF全文を取得して本文検証待ちに登録
        run: python scripts/collect_kaigo_documents.py
      - name: 資料取得履歴のみコミット
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaigo-navi2027-preview/data/document-review-queue.json
          if git diff --cached --quiet; then
            echo 'No new documents found'
          else
            git commit -m '公式資料PDFの全文取得状況を更新'
            git pull --rebase origin main
            git push origin main
          fi
