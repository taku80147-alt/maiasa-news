<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#063c9a">
  <title>毎朝ニュース</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand-row">
        <div>
          <p class="eyebrow">今日の営業に効く、注目トピックス</p>
          <h1><span class="sun" aria-hidden="true">☀</span>毎朝ニュース</h1>
        </div>
        <div id="updated" class="updated">更新確認中</div>
      </div>
      <nav id="tabs" aria-label="ニュースの分類"></nav>
    </div>
  </header>

  <main>
    <section class="notice" aria-label="掲載方針">
      <strong>公式情報＋JOINT</strong>
      <span>JOINTは元記事へのリンク紹介。配布用チェックは利用条件を確認した公式記事だけに表示します。</span>
    </section>

    <section id="important-section" class="section">
      <div class="section-head">
      <div><span class="section-kicker">まずここだけ</span><h2>今日の注目</h2></div>
        <span class="count" id="important-count"></span>
      </div>
      <div id="important-list" class="news-list important-grid"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div><span class="section-kicker">すべての新着</span><h2 id="list-title">すべての新着</h2></div>
        <span class="count" id="result-count"></span>
      </div>
      <div id="news-list" class="news-list"></div>
      <div id="empty" class="empty" hidden>この分類の新着情報はありません。</div>
    </section>
  </main>

  <div id="selection-bar" class="selection-bar" hidden>
    <span><b id="selection-count">0</b>件を選択中</span>
    <button id="make-pdf">選んだ記事でPDFを作成</button>
  </div>

  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <button class="close" id="close-detail" aria-label="詳細を閉じる">×</button>
    <div id="detail"></div>
  </dialog>

  <template id="card-template">
    <article class="card">
      <button class="card-button">
        <div class="card-top"><span class="card-number"></span><span class="tag"></span><span class="status"></span></div>
        <h3></h3>
        <p class="summary"></p>
        <div class="meta"><span class="source-name"></span><time></time></div>
        <label class="select-row"><input type="checkbox"><span>配布資料に追加</span></label>
      </button>
    </article>
  </template>
  <script src="app.js?v=11" defer></script>
</body>
</html>
